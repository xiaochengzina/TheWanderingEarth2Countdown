; ============================================================================
; TheWanderingEarth2Countdown  流浪地球 2 · 桌面倒计时
;
; 文件结构：
;   CountDown.ini                        本文件（皮肤骨架 + meter 排布）
;   @Resources\Configs\Layout.inc        内部布局常量（像素级基准，勿改）
;   @Resources\Configs\Variables.inc     用户设置（控制面板自动写入）
;   @Resources\Configs\Default.inc       出厂默认设置（「恢复默认」用）
;   @Resources\Scripts\Common.lua        共享工具（数值校验 / 颜色解析 / 日期换算）
;   @Resources\Scripts\Countdown.lua     倒计时逻辑
;   Settings\Settings.ini                控制面板
;   @Resources\Scripts\Settings.lua      控制面板逻辑
;
; 使用：右键皮肤 → 打开控制面板
;
; 排布说明：所有 meter 都按 Layout.inc 里的设计基准「绝对定位」，
;           坐标统一写成 (#常量# * #Scale#)，因此缩放时不会错位。
;           唯一的相对定位是「天」——它跟在数字右边缘后面，
;           这样 5 位数变成 4 位数时整体会自动收窄。
; ============================================================================

[Rainmeter]
Update=1000
AccurateText=1
; 允许文字 / 缩放变化时窗口自动跟随（控制面板可以做到即时生效）
DynamicWindowSize=1
ContextTitle=打开控制面板
ContextAction=[!ActivateConfig "TheWanderingEarth2Countdown\Settings" "Settings.ini"]
ContextTitle2=刷新皮肤
ContextAction2=[!Refresh]

[Metadata]
Name=流浪地球 倒计时
Author=小城子
Information=流浪地球 2 桌面倒计时 · 右键皮肤 → 打开控制面板
Version=1.2.0

; ------------------------------------------------------------ 变量与包含 ---
; @include1 放内部布局常量，@include2 放用户设置（后者优先级更高）
[Variables]
@include1=#@#Configs\Layout.inc
@include2=#@#Configs\Variables.inc
; 简写：更新全部 meter 并重绘
U=[!UpdateMeter *][!Redraw]

; ---------------------------------------------------------------- 脚本 -----

; UpdateDivider=-1：不进更新循环，只被 meter 用 [&...:函数()] 取值时调用
[MeasureCountdown]
Measure=Script
ScriptFile=#@#Scripts\Countdown.lua
UpdateDivider=-1

; ---------------------------------------------------------------- 样式 -----

; 中文：字魂59号-创粗黑 + 负字间距（字形更紧凑，与设计稿一致）
[CnTextStyle]
AntiAlias=1
FontColor=#ColorText#
FontFace=#FontCn#
FontSize=(#CnFontSize# * #Scale#)
InlineSetting=CharacterSpacing | [&MeasureCountdown:CnSpacing()] | [&MeasureCountdown:CnSpacing()]
DynamicVariables=1

; 英文：DIN 1451 + 微正字间距
[EnTextStyle]
AntiAlias=1
FontColor=#ColorText#
FontFace=#FontEn#
FontSize=(#EnFontSize# * #Scale#)
InlineSetting=CharacterSpacing | [&MeasureCountdown:EnSpacing()] | [&MeasureCountdown:EnSpacing()]
DynamicVariables=1

; ============================================================================
; 图形
; ============================================================================

; ---------------------------------------------------------- 中文标题 --------
[MeterCnText]
Meter=String
MeterStyle=CnTextStyle
Text=#CnText#
X=(#TitleX# * #Scale#)
Y=(#TitleY# * #Scale#)

; ---------------------------------------------------------- 中文副标题 ------

; -------------------------------------------------------------- 红色竖条 -----
[MeterBar]
Meter=Image
SolidColor=#ColorAccent#
X=((#BarX# + Max(0, [MeterCnText:W] / #Scale# - #TitleMaxW#)) * #Scale#)
Y=(#BarY# * #Scale#)
W=(#BarW# * #Scale#)
H=(#BarH# * #Scale#)
AntiAlias=1
DynamicVariables=1

[MeterCnSub]
Meter=String
MeterStyle=CnTextStyle
Text=#CnSubText#
X=((#SubX# + Max(0, [MeterCnText:W] / #Scale# - #TitleMaxW#)) * #Scale#)
Y=(#SubY# * #Scale#)

; ---------------------------------------------------------- 大号数字 --------
; 数字大小随「剩余时间」自动切换单位（天 / 时 / 分 / 秒），所以位数会变，
; 窗口宽度也跟着收放（这是设计如此，见 Layout.inc 的单位表）。
; 行框上沿在设计基准里是负值（详见 Layout.inc 的说明），
; 字形实际落在窗口内 y≈20 处，不会缺笔画。
; 负字距用来把数字块的整体宽度收到设计稿尺寸（见 Layout.inc 的 DaysSpacing）——
; InlineSetting 不支持公式，所以数值由 Countdown.lua 提供。
[MeterDays]
Meter=String
Text=[&MeasureCountdown:Value()]
FontColor=#ColorAccent#
FontFace=#FontDays#
FontSize=(#DaysFontSize# * #Scale#)
InlineSetting=CharacterSpacing | [&MeasureCountdown:DaysSpacing()] | [&MeasureCountdown:DaysSpacing()]
AntiAlias=1
X=((#DaysX# + Max(0, [MeterCnText:W] / #Scale# - #TitleMaxW#)) * #Scale#)
Y=(#DaysY# * #Scale#)
DynamicVariables=1

; ---------------------------------------------------------- 单位 ------------
; X 用 (间隙)R：紧贴上一个 meter（MeterDays）的右边缘，随数字位数自动移动
[MeterUnit]
Meter=String
MeterStyle=CnTextStyle
Text=[&MeasureCountdown:UnitCn()]
X=(#UnitGap# * #Scale#)R
Y=(#UnitY# * #Scale#)

; ---------------------------------------------------------- 右侧留白 --------
; 一段几乎全透明的 Shape，只用来把窗口右边缘撑到单位右侧 PadRight 处，
; 让右边不至于贴死。改 Layout.inc 里的 PadRight 即可（设为 0 就是紧贴）。
; 它必须紧跟 MeterUnit：0R 表示「上一个 meter 的右边缘」。
[MeterPadRight]
Meter=Shape
Shape=Rectangle 0,0,(#PadRight# * #Scale#),1 | StrokeWidth 0 | Fill Color 0,0,0,1
AntiAlias=1
X=0R
Y=0
DynamicVariables=1

; ---------------------------------------------------------- 英文标题 --------
[MeterEnTitle]
Meter=String
MeterStyle=EnTextStyle
Text=#EnText#
X=((#EnX# + Max(0, [MeterCnText:W] / #Scale# - #TitleMaxW#)) * #Scale#)
Y=(#EnTitleY# * #Scale#)

; ---------------------------------------------------------- 英文剩余时间 ----
; 整行由 EnLine() 生成（含单位与单复数）：IN 71 HOURS / IN 1 DAY
[MeterEnDays]
Meter=String
MeterStyle=EnTextStyle
Text=[&MeasureCountdown:EnLine()]
X=((#EnX# + Max(0, [MeterCnText:W] / #Scale# - #TitleMaxW#)) * #Scale#)
Y=(#EnDaysY# * #Scale#)

; ---------------------------------------------------------- 底部留白 --------
; 同理，用来把窗口下边缘再往下撑 PadBottom 像素
[MeterPadBottom]
Meter=Shape
Shape=Rectangle 0,0,1,(#PadBottom# * #Scale#) | StrokeWidth 0 | Fill Color 0,0,0,1
AntiAlias=1
X=0
Y=0R
DynamicVariables=1
