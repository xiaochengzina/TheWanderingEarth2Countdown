; ============================================================================
; 分页 2 · 外观
;
; 两种颜色都用「取色器」：点色块 → 弹出系统取色器 → 选完自动写回
; @Resources\Configs\Variables.inc 并刷新面板。
;
; 取色器是 @Resources\Addons\RainRGB4.exe（第三方小工具，直接改文件、不经 Lua）：
;     VarName        要写的变量名
;     FileName       写到哪个文件
;     RefreshConfig  写完后刷新哪个皮肤
;
; 色块的填充色直接引用 #UiAccent# / #UiText#，刷新后自动跟着变；
; 右边的数值文本由 Settings.lua 的 ColorText() 转成 #RRGGBB · R,G,B。
;
; ⚠ RainRGB4 的 RefreshConfig 只能填一个皮肤，这里填面板自己。
;   主皮肤靠面板 Initialize() 里的 PushColorsToMain() 同步过去，
;   所以改完颜色两边会一起变，不需要手动刷新。
; ============================================================================

