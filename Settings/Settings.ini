; ============================================================================
; 分页 1 · 内容
;
; 目标时间是一个「模式」而不是一个时刻：年 / 月 / 日 / 时 / 分 都可以留空，
; 留空表示该项「任意」，于是目标变成一串重复出现的时刻，倒计时到点后
; 自动开始下一轮；六项全填则只触发一次，到点后停在 0 秒。
;
; 留空怎么写：
;   年 / 月 / 日 → 填 0 或把输入框清空都算留空（0 年 0 月 0 日本来就不合法）
;   时 / 分      → 必须清空；0 是「0 点 / 0 分」
;   秒           → 不支持留空，空按 0 算
;
; 操作：
;   输入框  点一下弹出，回车确认；清空后回车 = 设为「循环」
;   步进器  月 / 日 / 时 / 分 会在「循环」与数值之间循环走；
;           年只走 ±1（用输入框清空来设循环）；秒走 0–59
; ============================================================================

