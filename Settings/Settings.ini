; ============================================================================
; Settings.ini  控制面板 v1.2.0（深色主题 · 左侧三分页导航）
;
; 分页：1 内容（文字与目标日期） 2 外观（缩放与配色） 3 高级（文件夹/重置/关于）
;
; 控件命名约定（与 Settings.lua 一一对应）：
;   滑块类   Slt<ID>（一个 Shape 里三段）
;              Shape  轨道 / Shape2 已填充段 / Shape3 旋钮
;              鼠标动作 → SliderJump('ID', $MouseX:%$) / SliderStep('ID', ±n)
;   输入框   Input<变量名>（InputText 度量）+ <前缀>Box（外框）+ <前缀>Val（显示值）
;              点击外框 → OpenTextInput('<变量名>')
;   步进器   Date<字段>Minus / Date<字段>Val / Date<字段>Plus → StepDate('year', ±1)
;   色块     SwatchAccent / SwatchText（由 Lua 上色）
;   按钮     FolderBtn / ResetBtn
;
; 【重要】带 StringAlign 且含 Center 的 meter，X / Y 是「锚点」（文字中心），
;         不是外框左上角。改坐标时务必同时移动外框与文字锚点。
;         规则：锚点 = 外框左上角 + 外框尺寸的一半。
;
; 面板与主皮肤的关系：
;   面板写 @Resources\Configs\Variables.inc，同时用 !SetVariable 同步到主皮肤
;   TheWanderingEarth2Countdown 并即时重绘，所以改设置不需要手动刷新皮肤。
; ============================================================================

[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=流浪地球 倒计时 · 控制面板
Author=小城子
Information=流浪地球 2 桌面倒计时皮肤的控制面板
Version=1.2.0

[Variables]
; 面板 UI 字体（Windows 自带）
FontMain=Microsoft YaHei UI

; 深色 + 红 配色 —— 这是**面板自己的固定外观**。
; ⚠ 故意不叫 ColorAccent / ColorText：下面 @include3 引入的 Variables.inc
;   里有同名的**用户**配色（两个色块要显示它），同名就会被覆盖，
;   表现出来就是「用户把正文色挑成绿色，面板自己的页标题也跟着变绿」。
;   面板 UI 一律用 UiAccent / UiText，只有那两个色块用用户的 Color*。
ColorBg=14,12,11
ColorNav=22,18,16
ColorCard=38,32,28
ColorInput=36,30,27
ColorBorder=74,63,55
ColorDivider=46,39,34
UiText=227,231,229
ColorSub=154,145,136
ColorHint=110,102,95
UiAccent=234,10,3
ColorAccentSoft=255,96,86
ColorTrack=64,54,47
ColorNavOff=176,166,158
ColorNavOn=255,255,255

; ---- 预览与「留空」显示用的中文文字 ----
; ⚠ Rainmeter 的 Lua 桥接会把「Lua 里拼出来的中文」按 ANSI 重编码 → 乱码，
;   所以所有中文标签都放在这里，由 Settings.lua 用 SKIN:GetVariable 读出来
;   再原样传回（那是原样往返，不会坏）。
;   改这里的文字就能改面板用语。
WildText=循环
RepeatYearly=每年
RepeatMonthly=每月
RepeatDaily=每日
RepeatHourly=每小时
RepeatMinutely=每分钟
RepeatOnce=一次性
PreviewNextPrefix=下一次：
PreviewNoMatch=没有未来匹配，已停在 0 秒

; 内部常量
PageCount=3

; Default.inc 提供 Def* 出厂值（「恢复默认」用变量引用方式写回，保证中文正确）
; Variables.inc 放用户当前设置，最后包含，确保用户值优先
@include1=#@#Configs\Layout.inc
@include2=#@#Configs\Default.inc
@include3=#@#Configs\Variables.inc

